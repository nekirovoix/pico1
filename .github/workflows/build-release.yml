name: Build firmware and Windows app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      config_path:
        description: Config file under config/
        required: true
        default: config/default.json
        type: string
      release_tag:
        description: Optional release tag, for example v1.2.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pico1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG_PATH: ${{ inputs.config_path || 'config/default.json' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested config path
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          config_root = (root / 'config').resolve()
          selected = (root / os.environ['CONFIG_PATH']).resolve()
          if config_root not in selected.parents or selected.suffix != '.json' or not selected.is_file():
              raise SystemExit('config_path must identify an existing JSON file directly under config/')
          PY
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate and validate assets
        run: python3 generator/generate.py --config "$CONFIG_PATH" --out /tmp/generated
      - name: JavaScript syntax checks
        working-directory: windows-app
        run: npm run check

  build-firmware:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gettext cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m pip install --upgrade pip
      - name: Prepare CircuitPython Python dependencies
        run: |
          VERSION="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONFIG_PATH"]))["circuitpython_version"])')"
          git clone --depth 1 --branch "$VERSION" https://github.com/adafruit/circuitpython.git build-work/circuitpython
          python3 -m pip install -r build-work/circuitpython/requirements-dev.txt
      - name: Build UF2
        env:
          JOBS: '2'
        run: bash generator/build.sh "$CONFIG_PATH"
      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: pico1-firmware
          path: generator/dist/
          if-no-files-found: error
          retention-days: 30

  package-windows:
    if: github.event_name != 'pull_request'
    needs: build-firmware
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows-app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: pico1-firmware
          path: windows-app/generator/dist
      - name: Install and check
        working-directory: windows-app
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Package Windows x64
        working-directory: windows-app
        run: npm run package
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path 'windows-app/out/Classroom-Studio-Firmware-win32-x64/*' -DestinationPath 'Classroom-Studio-Firmware-Windows-x64.zip' -Force
          $hash = (Get-FileHash 'Classroom-Studio-Firmware-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  Classroom-Studio-Firmware-Windows-x64.zip" | Set-Content -Encoding ascii 'Classroom-Studio-Firmware-Windows-x64.zip.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: pico1-windows-x64
          path: |
            Classroom-Studio-Firmware-Windows-x64.zip
            Classroom-Studio-Firmware-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-firmware, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pico1-firmware
          path: release/firmware
      - uses: actions/download-artifact@v4
        with:
          name: pico1-windows-x64
          path: release/windows
      - name: Create source archive
        run: git archive --format=zip --output=release/pico1-source.zip HEAD
      - name: Create release checksums
        run: (cd release && find . -type f ! -name RELEASE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > RELEASE-SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo 'release_tag must look like v1.2.3' >&2; exit 1;; esac
          find release -type f -print0 | xargs -0 gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$RELEASE_TAG"
